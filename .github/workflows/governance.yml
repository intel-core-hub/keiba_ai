name: Governance Checks

on:
  push:
  pull_request:

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Runtime import scanner
        run: python scripts/runtime_import_scanner.py
      - name: Critical path linter
        run: python scripts/critical_path_linter.py
      - name: Duplicate implementation detector
        run: python scripts/duplicate_impl_detector.py
      - name: Generate CI latency artifact
        run: python -m scripts.load_test 2 10 --mock-only --ci-output .ci_latency.json
      - name: Run tests
        run: |
          mkdir -p reports/stage4
          pytest -q \
            --cov=core \
            --cov=scripts.stage4_readiness_gate \
            --cov-branch \
            --cov-report=json:reports/stage4/critical_path_coverage.json
      - name: Stage 4 readiness gate when evidence artifacts are present
        run: |
          if [ -f logs/decisions.jsonl ] && [ -f derived/bets.csv ] && [ -f results/market_dependency/variant_summary.csv ] && [ -f results/market_dependency/odds_perturbation_summary.csv ] && [ -f reports/stage4/replay_report.json ] && [ -f reports/stage4/critical_path_coverage.json ]; then
            python -m scripts.stage4_readiness_gate --replay-report reports/stage4/replay_report.json --require-replay-report --coverage-json reports/stage4/critical_path_coverage.json
          else
            echo "Skipping Stage 4 readiness gate; evidence artifacts not present."
          fi
