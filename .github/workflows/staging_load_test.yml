name: Staging Load Test

on:
  workflow_dispatch:
    inputs:
      concurrency:
        description: 'Number of concurrent workers'
        required: false
        default: '10'
      requests_per_worker:
        description: 'Requests per worker'
        required: false
        default: '10'
  schedule:
    - cron: '0 3 * * *' # daily at 03:00 UTC

jobs:
  load-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run load test
        env:
          DISABLE_META: '1'
        run: |
          python -m scripts.load_test ${{ github.event.inputs.concurrency }} ${{ github.event.inputs.requests_per_worker }}

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: load-test-reports
          path: reports/
          retention-days: 30
